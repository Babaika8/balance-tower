<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#14282a">
  <title>Balance Tower: Zen WebGL</title>
  <link rel="stylesheet" href="./styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/",
        "@dimforge/rapier2d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier2d-compat@0.18.0/+esm"
      }
    }
  </script>
</head>
<body>
  <main id="game" aria-label="Balance Tower">
    <canvas id="world"></canvas>
    <div class="hud">
      <div class="score">Высота: <strong id="score">0</strong></div>
      <div class="coins"><span></span><strong id="coins">0</strong></div>
      <div class="badge">ZEN WEBGL</div>
    </div>
    <div id="loading">Загружаю Blender-сцену...</div>
    <div id="message" hidden>
      <strong>Башня упала</strong>
      <span>Коснитесь экрана, чтобы начать заново</span>
    </div>
    <div class="controls">
      <button data-boost="freeze"><span>Заморозка</span><b>40</b></button>
      <button data-boost="slow"><span>Медленно</span><b>35</b></button>
      <button data-boost="magnet"><span>Магнит</span><b>30</b></button>
    </div>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
