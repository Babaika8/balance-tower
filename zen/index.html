         title="ручной просмотр высоты">

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/",
    "rapier": "https://unpkg.com/@dimforge/rapier2d-compat@0.14.0/rapier.es.js"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import RAPIER from 'rapier';

/* ---------------------------------------------------------------------------
   STEP ONE: sky and ground, nothing else. Every previous pass tried to solve
   the whole scene - pagoda, trees, bridge, lantern, bloom - at once, and kept
   getting rejected as a whole. Reduced to the two things a landscape needs
   first, so each can be judged on its own before anything else is added.
--------------------------------------------------------------------------- */
/* "Прохладный сумрак" - the palette already chosen for this game and living
   in game.gd's _atmo_phases(): teal morning, soft day, plum sunset, cold
   night, walked through by how high the tower has grown. Its four stops are
   carried over here unchanged and mapped onto the climb, so the Zen page and
   the shipped game speak the same colours.

   The game's own hill tint is NOT carried over. It is a multiplier tuned to
   that scene's warm hills, and on these cool blue-grey silhouettes it turned
   everything muddy brown against a teal sky. Instead each layer's colour is
   derived from the sky of the moment: aerial perspective, where a shape sits
   closer to the sky the further away it is. That keeps every phase coherent
   by construction - plum mountains under a plum sunset, near-black under a
   night sky - and keeps the depth order fixed whatever the hour. */
const PHASES = [
  { at:   0, top: '#A9C7BF', mid: '#C6D6CD', low: '#E3D2CB', sun: '#FFF6E9' },
  { at: 100, top: '#8FB4AC', mid: '#BFD3CA', low: '#DCC9C6', sun: '#FBF3E0' },
  { at: 200, top: '#5E6796', mid: '#9A7E9E', low: '#D98E72', sun: '#FF9A5A' },
  { at: 300, top: '#141B33', mid: '#23264A', low: '#3A3560', sun: '#E7E9F6' },
];

// How far each layer sits from the sky's own colour. Farther things are
// hazier and paler, nearer things darker and denser.
const HAZE = {
  mtn_fuji: 0.20,
  mtn_far: 0.38,
  mtn_near: 0.58,
  ground_near: 0.76,
};
const CLOUD_LIFTEN = 0.34;   // clouds sit lighter than the sky, not darker
const SNOW_LIGHTEN = 0.78;

const _a = new THREE.Color(), _b = new THREE.Color();
const WHITE = new THREE.Color(1, 1, 1);
const skyTop = new THREE.Color(), skyMid = new THREE.Color(), skyLow = new THREE.Color();
const sunColour = new THREE.Color(), deepColour = new THREE.Color();

function samplePhase(slider) {
  let i = 0;
  while (i < PHASES.length - 2 && slider > PHASES[i + 1].at) i++;
  const p = PHASES[i], q = PHASES[i + 1];
  const t = Math.min(1, Math.max(0, (slider - p.at) / (q.at - p.at)));
  const mix = (key, out) => out.copy(_a.setStyle(p[key])).lerp(_b.setStyle(q[key]), t);
  mix('top', skyTop); mix('mid', skyMid); mix('low', skyLow); mix('sun', sunColour);
  // The dark end every silhouette leans toward: the sky's own top, deepened,
  // so the hue always belongs to the hour.
  deepColour.copy(skyTop).multiplyScalar(0.42);
}

/* Everything is built in the sky's own hue, moving only lightness and
   saturation. Mixing two colours instead - a warm horizon against a cool
   shadow - is what turned the mountains to brown mud: blending across hues
   lands in the dead middle. Staying on one hue cannot do that, and the
   receding layers read as one palette at every hour of the climb. */
const _hsl = { h: 0, s: 0, l: 0 };

function layerColour(name, out) {
  if (name === 'sun') return out.copy(sunColour);
  skyMid.getHSL(_hsl);
  if (name === 'fuji_snow') {
    return out.setHSL(_hsl.h, _hsl.s * 0.28, Math.min(0.97, _hsl.l + 0.34));
  }
  if (name.startsWith('cloud')) {
    return out.setHSL(_hsl.h, _hsl.s * 0.62, _hsl.l + (1 - _hsl.l) * CLOUD_LIFTEN);
  }
  const haze = HAZE[name] ?? 0;
  const l = _hsl.l + (0.13 - _hsl.l) * haze;
  const s = Math.min(1, _hsl.s * (1 + haze * 0.9));
  return out.setHSL(_hsl.h, s, l);
}

// Stones are the nearest thing in the scene, so they sit darkest of all, with
// a little shade alternation so a stack does not read as one solid block.
function stoneColour(shade, out) {
  skyMid.getHSL(_hsl);
  const l = Math.min(0.92, Math.max(0.05, _hsl.l + (0.13 - _hsl.l) * 0.88 + shade));
  return out.setHSL(_hsl.h, Math.min(1, _hsl.s * 1.7), l);
}

/* Shading a mountain from its OWN silhouette, not from a gradient down its
   bounding box.

   A single top-to-bottom ramp knows nothing about where the ridges are, so
   every peak and every valley got the same tone at the same height and the
   card still read as cut paper. What actually makes a mountain legible is
   depth below its own skyline: the metre under a ridge catches light, the
   mass far beneath it falls away.

   The skyline is not authored anywhere - it is read back off the geometry at
   load time. For each column across the card, the highest vertex there is
   its horizon; shading is then a function of how far below that horizon a
   pixel sits. Works for any card without knowing which mountain it is. */
function buildSkyline(geometry, columns) {
  const pos = geometry.attributes.position;
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (let i = 0; i < pos.count; i++) {
    minX = Math.min(minX, pos.getX(i)); maxX = Math.max(maxX, pos.getX(i));
    minY = Math.min(minY, pos.getY(i)); maxY = Math.max(maxY, pos.getY(i));
  }
  const spanX = Math.max(maxX - minX, 1e-6), spanY = Math.max(maxY - minY, 1e-6);
  const top = new Float32Array(columns).fill(-Infinity);
  for (let i = 0; i < pos.count; i++) {
    const c = Math.min(columns - 1,
      Math.floor((pos.getX(i) - minX) / spanX * columns));
    top[c] = Math.max(top[c], pos.getY(i));
  }
  // Vertices only mark the corners of the outline; fill the gaps between them
  // so the horizon is continuous rather than a comb.
  let last = maxY;
  for (let c = 0; c < columns; c++) {
    if (top[c] === -Infinity) top[c] = last; else last = top[c];
  }
  for (let c = columns - 1; c >= 0; c--) {
    if (top[c] === -Infinity) top[c] = last; else last = top[c];
  }
  return { minX, spanX, minY, spanY, top, columns };
}

function makeSilhouetteTexture(sky, opts) {
  const W = 256, H = 256;
  const band = opts.band;              // how deep the lit edge reaches, 0..1
  const drop = opts.drop;              // how dark the mass below goes
  let state = opts.seed;
  const rand = () => {
    state = (state * 1664525 + 1013904223) >>> 0;
    return state / 4294967296;
  };
  const grain = tileableNoise(9, rand);

  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(W, H);
  for (let x = 0; x < W; x++) {
    const u = x / (W - 1);
    const col = Math.min(sky.columns - 1, Math.floor(u * sky.columns));
    // Height of this column's horizon, as a fraction of the card.
    const horizon = (sky.top[col] - sky.minY) / sky.spanY;
    for (let y = 0; y < H; y++) {
      // v = 0 at the card's bottom, matching the UVs written in Blender.
      const v = 1 - y / (H - 1);
      const below = Math.max(0, horizon - v);
      let shade = 1 - drop * Math.min(1, below / band);
      if (opts.flow) {
        /* Ice reads as flow lines running down the slope, not as blotches.
           Narrow vertical streaks, fading as they descend. */
        /* Two frequencies, each wandered off course by the noise, so the
           lines do not march in step - one fixed frequency read as
           corrugated metal rather than ice. */
        const a = Math.sin(u * 31.0 + grain(u, 0.2) * 14.0);
        const b = Math.sin(u * 53.0 + grain(u, 0.8) * 18.0);
        const streak = Math.max(0, a) ** 8 * 0.6 + Math.max(0, b) ** 10 * 0.4;
        shade -= streak * 0.055 * Math.min(1, below / band);
      }
      shade += (grain(u, v) - 0.5) * opts.grain;
      const val = Math.max(0, Math.min(1, shade)) * 255;
      const i = (y * W + x) * 4;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = val;
      img.data[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.anisotropy = 4;
  return tex;
}

const SILHOUETTE = {
  mtn_far:   { band: 0.30, drop: 0.16, grain: 0.020, seed: 11 },
  mtn_near:  { band: 0.26, drop: 0.22, grain: 0.026, seed: 23 },
  mtn_fuji:  { band: 0.22, drop: 0.18, grain: 0.018, seed: 37 },
  // The glacier: a shallower lit edge and flow lines down the ice.
  fuji_snow: { band: 0.34, drop: 0.13, grain: 0.014, seed: 53, flow: true },
};


const status = document.getElementById('status');
const ui = document.getElementById('ui');
const climbInput = document.getElementById('climb');
const climbValue = document.getElementById('climbValue');
const scoreLabel = document.getElementById('score');

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const GROUND_TEX = makeGroundTexture();

/* One canvas and one texture, repainted in place as the phase drifts -
   making a fresh CanvasTexture every frame would leak GPU memory. */
const skyCanvas = document.createElement('canvas');
skyCanvas.width = 4; skyCanvas.height = 512;
const skyCtx = skyCanvas.getContext('2d');
const skyTexture = new THREE.CanvasTexture(skyCanvas);
skyTexture.colorSpace = THREE.SRGBColorSpace;
scene.background = skyTexture;

function paintSky() {
  const gradient = skyCtx.createLinearGradient(0, 0, 0, 512);
  gradient.addColorStop(0.0, '#' + skyTop.getHexString());
  gradient.addColorStop(0.62, '#' + skyMid.getHexString());
  gradient.addColorStop(1.0, '#' + skyLow.getHexString());
  skyCtx.fillStyle = gradient;
  skyCtx.fillRect(0, 0, 4, 512);
  skyTexture.needsUpdate = true;
}

// Far plane well past the Fuji: it now sits at ~470 units, and the old 300
// would have clipped it out of the scene entirely.
const camera = new THREE.PerspectiveCamera(24, innerWidth / innerHeight, 1, 1200);
const CAMERA_Z = 40;
const BASE_Y = 4.0;
camera.position.set(0, BASE_Y, CAMERA_Z);
camera.lookAt(0, BASE_Y - 3.0, 0);

// One key light and one soft fill - nothing else competing for attention
// while sky and ground are being judged on their own.
// No lights: every material is unlit, so nothing here would read them.

let world = null;
let fuji = null;
let fujiBaseY = 0;

/* The Fuji is lifted by the climb, and that is deliberate rather than
   physical. A static mountain cannot do what the owner drew: as the camera
   rises, EVERYTHING in the distance sinks down the frame, the far things
   just more slowly than the near ones. So parallax alone reveals more of
   the Fuji while its summit still travels downward - measured, it drops
   about a fifth of the frame between climb 100 and climb 200, where the
   drawing asks for the summit to leave the frame through the top instead.

   Climb 100 is left exactly where the geometry puts it, which is already
   the drawn frame. Past that the mountain is raised so the summit clears
   the top edge by climb 200, and the ridges keep sinking on their own. */
const CLIMB_UNIT = 0.16;             // slider value -> camera height units
const FUJI_LIFT = 20.0;              // scene units at full reveal
const FUJI_FROM = 100 * CLIMB_UNIT;  // starts emerging at slider 100
const FUJI_TO = 200 * CLIMB_UNIT;    // fully out by slider 200
/* Even, across the whole range. The previous curve decelerated - it was set
   to keep slider 150 at the lift signed off there, which packed most of its
   travel into the first half and rose exactly as fast as before. Those two
   wishes are the same thing said in opposite directions, and slower wins, so
   this is a plain smoothstep: eases out of the ridges, steady through the
   middle, settles at 200. */
function fujiLift(cameraClimb) {
  const t = Math.min(1, Math.max(0, (cameraClimb - FUJI_FROM) / (FUJI_TO - FUJI_FROM)));
  return FUJI_LIFT * t * t * (3 - 2 * t);
}

/* The sun comes up on the right, starting after the Fuji is already on its
   way so the two do not arrive together. It sits farther out than the
   mountain, so the sinking ridges uncover it and the disc itself only
   drifts - the same reason the Fuji stopped looking like it was flying. */
const SUN_LIFT = 122.0;
const SUN_FROM = 140 * CLIMB_UNIT;
const SUN_TO = 300 * CLIMB_UNIT;
let sun = null;
let sunBaseY = 0;

function sunLift(cameraClimb) {
  const t = Math.min(1, Math.max(0, (cameraClimb - SUN_FROM) / (SUN_TO - SUN_FROM)));
  return SUN_LIFT * t * t * (3 - 2 * t);
}

/* The clouds are separate little shapes filling a zone, not two long
   ribbons: the owner's two strokes marked WHERE clouds should be, not the
   clouds themselves. Each drifts sideways and slowly breathes its width, so
   the zone travels and changes shape. Farther clouds drift slower, which
   keeps the depth reading. */
const clouds = [];
const tinted = [];

/* ---------------------------------------------------------------------------
   THE GAME. Stones swing overhead, a tap drops one, and real physics decides
   whether it stays. Rapier owns every stone's motion and contact; nothing
   here fakes a landing.

   The stones keep the game's own proportions - 180 x 56 logical pixels, so
   3.2 wide to 1 tall - and live on the z = 0 plane, which is where the
   ground already sits, so the camera framing worked out for the background
   holds for gameplay too.
--------------------------------------------------------------------------- */
const STONE_W = 2.6, STONE_H = STONE_W / 3.2;
const BASE_TOP = -1.5;            // ground level, where the tower starts
const DROP_ABOVE = 3.2;           // how far over the tower the carrier rides
const SWING = 2.0;                // how far the carrier travels each way
const BASE_HALF = STONE_W * 1.1;  // the foundation, wider than one stone
const CAM_DEADZONE = 4.2;         // the camera holds still for the first few

let physics = null;               // the Rapier world, once its wasm is ready
const stones = [];                // { body, mesh, half }
let carrier = null;               // the stone being swung, not yet dropped
let falling = null;               // the stone in flight
let settleTimer = 0;
let score = 0;
let towerTop = BASE_TOP;
let over = false;
let clock = 0;                    // seconds, shared by the swing and the spawn

const stoneGroup = new THREE.Group();
scene.add(stoneGroup);

function roundedRect(w, h, r) {
  const s = new THREE.Shape();
  const x = -w / 2, y = -h / 2;
  s.moveTo(x + r, y);
  s.lineTo(x + w - r, y);
  s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + h - r);
  s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  s.lineTo(x + r, y + h);
  s.quadraticCurveTo(x, y + h, x, y + h - r);
  s.lineTo(x, y + r);
  s.quadraticCurveTo(x, y, x + r, y);
  const geo = new THREE.ShapeGeometry(s, 6);
  /* ShapeGeometry hands back UVs equal to the shape's own coordinates, so
     they run -w/2..w/2 rather than 0..1 and a texture would land at an
     arbitrary scale. Normalised here, once, at build time. */
  const uv = geo.attributes.uv;
  for (let i = 0; i < uv.count; i++) {
    uv.setXY(i, (uv.getX(i) + w / 2) / w, (uv.getY(i) + h / 2) / h);
  }
  uv.needsUpdate = true;
  return geo;
}

/* Stone surface, drawn in code. Value noise rather than per-pixel random:
   a grid of random values read back with smooth interpolation, so the
   mottling has a size and survives being stretched across the stone. Plain
   noise banded badly on the mountains for exactly the opposite reason - it
   had no size at all. Two octaves give a broad blotch with finer grain over
   it, and a top-down ramp puts the light overhead. */
function valueNoise(w, h, cells, rand) {
  const gw = cells + 1, gh = Math.max(2, Math.round(cells * h / w) + 1);
  const grid = new Float32Array(gw * gh);
  for (let i = 0; i < grid.length; i++) grid[i] = rand();
  const smooth = (t) => t * t * (3 - 2 * t);
  return (x, y) => {
    const fx = x * (gw - 1), fy = y * (gh - 1);
    const ix = Math.min(gw - 2, Math.floor(fx)), iy = Math.min(gh - 2, Math.floor(fy));
    const tx = smooth(fx - ix), ty = smooth(fy - iy);
    const a = grid[iy * gw + ix], b = grid[iy * gw + ix + 1];
    const c = grid[(iy + 1) * gw + ix], d = grid[(iy + 1) * gw + ix + 1];
    return (a + (b - a) * tx) * (1 - ty) + (c + (d - c) * tx) * ty;
  };
}

function makeStoneTexture(seed) {
  let state = seed;
  const rand = () => {
    state = (state * 1664525 + 1013904223) >>> 0;
    return state / 4294967296;
  };
  const W = 256, H = 80;
  const broad = valueNoise(W, H, 5, rand);
  const fine = valueNoise(W, H, 14, rand);

  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(W, H);
  for (let y = 0; y < H; y++) {
    const v = y / (H - 1);
    const lit = 1.0 - 0.16 * v;                 // light from above
    const rim = v > 0.86 ? (v - 0.86) / 0.14 * 0.10 : 0;   // grounded edge
    for (let x = 0; x < W; x++) {
      const u = x / (W - 1);
      const mottle = (broad(u, v) - 0.5) * 0.11 + (fine(u, v) - 0.5) * 0.05;
      const val = Math.max(0, Math.min(1, lit + mottle - rim)) * 255;
      const i = (y * W + x) * 4;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = val;
      img.data[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.ClampToEdgeWrapping;
  tex.anisotropy = 4;
  return tex;
}

// A handful of variants so a stack is not the same stone repeated.
const STONE_TEX = [7, 1289, 55021, 90210].map(makeStoneTexture);

/* The ground is the hard one, and not for artistic reasons. It is the only
   horizontal surface in the scene and the camera looks along it at about
   four degrees, so it is foreshortened roughly seventeen to one between the
   near edge and the far one. Detail that looks right underfoot turns into
   shimmer at the horizon.

   So: the pattern TILES at a fixed world size rather than being stretched
   once across the plane, which keeps a patch the same real size wherever it
   is; mipmaps and anisotropic filtering handle the compression; and the
   contrast is deliberately low, because what survives seventeen-to-one
   squeeze is broad tone, never fine grain. The existing vertex-colour
   gradient still carries the recession - this only adds surface. */
function tileableNoise(cells, rand) {
  const g = new Float32Array(cells * cells);
  for (let i = 0; i < g.length; i++) g[i] = rand();
  const at = (ix, iy) => g[(iy % cells) * cells + (ix % cells)];
  const smooth = (t) => t * t * (3 - 2 * t);
  return (x, y) => {
    const fx = x * cells, fy = y * cells;
    const ix = Math.floor(fx), iy = Math.floor(fy);
    const tx = smooth(fx - ix), ty = smooth(fy - iy);
    const a = at(ix, iy), b = at(ix + 1, iy);
    const c = at(ix, iy + 1), d = at(ix + 1, iy + 1);
    return (a + (b - a) * tx) * (1 - ty) + (c + (d - c) * tx) * ty;
  };
}

function makeGroundTexture() {
  let state = 20260823;
  const rand = () => {
    state = (state * 1664525 + 1013904223) >>> 0;
    return state / 4294967296;
  };
  const N = 256;                       // power of two, so mipmaps are built
  const broad = tileableNoise(4, rand);
  const mid = tileableNoise(11, rand);
  const fine = tileableNoise(29, rand);

  const c = document.createElement('canvas');
  c.width = c.height = N;
  const ctx = c.getContext('2d');
  const img = ctx.createImageData(N, N);
  for (let y = 0; y < N; y++) {
    for (let x = 0; x < N; x++) {
      const u = x / N, v = y / N;
      const n = (broad(u, v) - 0.5) * 0.085
              + (mid(u, v) - 0.5) * 0.05
              + (fine(u, v) - 0.5) * 0.022;
      const val = Math.max(0, Math.min(1, 1.0 + n - 0.05)) * 255;
      const i = (y * N + x) * 4;
      img.data[i] = img.data[i + 1] = img.data[i + 2] = val;
      img.data[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  // The plane is 140 x 90 world units; one tile every ~7 units keeps a patch
  // a believable size on the ground rather than a pattern painted on it.
  tex.repeat.set(140 / 7, 90 / 7);
  tex.generateMipmaps = true;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

const STONE_GEO = roundedRect(STONE_W, STONE_H, STONE_H * 0.34);

/* Every stone is a flat face, and if they all sat on the same plane their
   overlapping edges would be exactly coplanar - the depth buffer cannot
   choose between two surfaces at identical depth, so the contact patch
   flickers as the winner changes frame to frame. Each stone therefore gets
   its own thin depth slice, newest nearest the camera. The step is small
   enough that the perspective size change is invisible: a sixty-stone tower
   spans less than a unit against a forty-unit camera distance. */
const STONE_LAYER = 0.012;

function makeStoneMesh(index) {
  const mesh = new THREE.Mesh(STONE_GEO, new THREE.MeshBasicMaterial({
    side: THREE.DoubleSide,
    map: STONE_TEX[index % STONE_TEX.length],
  }));
  // Alternating shades, or a stack of identical slabs reads as one block.
  mesh.userData.shade = index % 2 ? 0.06 : -0.04;
  mesh.userData.z = index * STONE_LAYER;
  stoneGroup.add(mesh);
  return mesh;
}

// One definition of where the carrier is, so spawn and update cannot
// disagree about it by even a frame.
function swingAt(t) {
  return Math.sin(t * 1.15) * SWING;
}

function spawnCarrier() {
  if (over) return;
  const mesh = makeStoneMesh(stones.length);
  /* Born exactly where the swing already is, and placed immediately.

     Two one-frame ghosts lived here in turn. First the mesh was left at the
     origin until the next frame, flashing in the middle of the stack. Fixing
     that by placing it at x = 0 only moved the ghost: the swing is a
     function of the clock, so on the very next frame the stone jumped
     sideways to wherever the sine had got to - a flash at the spawn point
     instead. Reading the same clock here means there is nothing to jump
     from. */
  carrier = { mesh, x: swingAt(clock), y: towerTop + DROP_ABOVE };
  mesh.position.set(carrier.x, carrier.y, mesh.userData.z);
  mesh.rotation.z = 0;
}

function startPhysics() {
  physics = new RAPIER.World({ x: 0.0, y: -20.0 });
  physics.timestep = 1 / 60;
  /* Stone, not rubber. A stone read as bouncy for four separate reasons and
     restitution was the smallest of them:
       - it fell from five units under heavy gravity, hitting at ~16 u/s, and
         at that speed even a dead-inelastic contact pops as the solver
         pushes the overlap back out;
       - the solver ran few iterations, so a fresh contact stayed soft and
         the whole stack jiggled while it tightened;
       - the stones were light, so contact impulses moved them easily;
       - and damping was low, so whatever wobble started took a long time to
         die.
     Gravity and drop height are down, iterations up, stones heavier and
     better damped, and restitution is now exactly zero. */
  if ('numSolverIterations' in physics) physics.numSolverIterations = 12;
  accumulator = 0;

  // The base the tower is built on: fixed, and wider than a stone so the
  // first drop has something forgiving to land on.
  const ground = physics.createRigidBody(RAPIER.RigidBodyDesc.fixed()
    .setTranslation(0, BASE_TOP - 8.0));
  // Deep, not a slab: a thin floor is easy for a fast body to skip past in
  // one step, and the first stone was tunnelling straight through it.
  physics.createCollider(RAPIER.ColliderDesc.cuboid(BASE_HALF, 8.0)
    .setFriction(1.6)
    .setRestitution(0.0)
    .setRestitutionCombineRule(RAPIER.CoefficientCombineRule.Min), ground);

  const slab = new THREE.Mesh(roundedRect(BASE_HALF * 2, 2.0, 0.18),
    new THREE.MeshBasicMaterial({ side: THREE.DoubleSide, map: STONE_TEX[0] }));
  slab.position.set(0, BASE_TOP - 1.0, -STONE_LAYER);
  slab.userData.z = -STONE_LAYER;
  slab.userData.shade = -0.08;
  stoneGroup.add(slab);
  spawnCarrier();
}

function dropStone() {
  if (!physics || over || !carrier || falling) return;

  const body = physics.createRigidBody(RAPIER.RigidBodyDesc.dynamic()
    .setTranslation(carrier.x, carrier.y)
    .setLinearDamping(0.45)
    .setAngularDamping(0.9)
    .setCcdEnabled(true));
  physics.createCollider(RAPIER.ColliderDesc.cuboid(STONE_W / 2, STONE_H / 2)
    .setFriction(1.6)
    .setFrictionCombineRule(RAPIER.CoefficientCombineRule.Max)
    .setRestitution(0.0)
    .setRestitutionCombineRule(RAPIER.CoefficientCombineRule.Min)
    .setDensity(3.0), body);

  falling = { body, mesh: carrier.mesh };
  stones.push(falling);
  carrier = null;
  settleTimer = 0;
}

function stoneSettled(entry) {
  const v = entry.body.linvel(), w = entry.body.angvel();
  return Math.hypot(v.x, v.y) < 0.25 && Math.abs(w) < 0.35;
}

function endGame() {
  over = true;
  if (carrier) { stoneGroup.remove(carrier.mesh); carrier = null; }
  status.textContent = `башня рассыпалась · ${score}`;
  status.hidden = false;
}

function restart() {
  for (const s of stones) stoneGroup.remove(s.mesh);
  stones.length = 0;
  if (carrier) stoneGroup.remove(carrier.mesh);
  carrier = null; falling = null;
  stoneGroup.clear();
  score = 0; towerTop = BASE_TOP; over = false;
  status.hidden = true;
  if (physics) { physics.free(); physics = null; }
  startPhysics();
}

// Debug probe: module scope is not reachable from the console otherwise.
window.__zen = () => ({
  score, over, stones: stones.length, towerTop,
  carrier: carrier ? { x: +carrier.x.toFixed(2), y: +carrier.y.toFixed(2) } : null,
  falling: !!falling,
  ys: stones.map((s) => +s.body.translation().y.toFixed(2)),
  xs: stones.map((s) => +s.body.translation().x.toFixed(2)),
  world: physics ? {
    bodies: physics.bodies.len(),
    colliders: physics.colliders.len(),
    timestep: physics.timestep,
    gravity: physics.gravity,
  } : null,
});

/* Stepped on a real-time accumulator rather than once per frame. The frame
   rate is not the simulation rate: when the page ran fast the stones gained
   an enormous velocity and shot straight through the base. */
let accumulator = 0;

function updateGame(dt, now) {
  if (!physics) return;
  accumulator = Math.min(0.25, accumulator + dt);
  while (accumulator >= physics.timestep) {
    physics.step();
    accumulator -= physics.timestep;
  }

  for (const s of stones) {
    const p = s.body.translation();
    s.mesh.position.set(p.x, p.y, s.mesh.userData.z);
    s.mesh.rotation.z = s.body.rotation();
  }

  if (carrier) {
    carrier.y += (towerTop + DROP_ABOVE - carrier.y) * 0.12;
    carrier.x = swingAt(now);
    carrier.mesh.position.set(carrier.x, carrier.y, carrier.mesh.userData.z);
    carrier.mesh.rotation.z = 0;
  }

  if (falling) {
    const p = falling.body.translation();
    // Missed the tower entirely and kept going.
    if (p.y < BASE_TOP - 6.0) { endGame(); falling = null; return; }
    if (stoneSettled(falling)) {
      settleTimer += dt;
      if (settleTimer > 0.28) {
        const tilt = Math.abs(falling.body.rotation());
        if (tilt > 0.75) { endGame(); falling = null; return; }
        score += 1;
        towerTop = Math.max(towerTop, p.y + STONE_H * 0.5);
        scoreLabel.textContent = String(score);
        falling = null;
        spawnCarrier();
      }
    } else {
      settleTimer = 0;
    }
  }
}
const CLOUD_SPAN = { cloudhi_: 45.0, cloudlo_: 36.0 };

function wrapSpan(v, span) {
  const half = span * 0.5;
  return ((v + half) % span + span) % span - half;
}

new GLTFLoader().load('assets/zen_scene.glb?v=63073eb79db6c57a22ddaa4cb06d6272', (gltf) => {
  world = gltf.scene;
  world.traverse((node) => {
    if (node.name === 'mtn_fuji') { fuji = node; fujiBaseY = node.position.y; }
    if (node.name === 'sun') { sun = node; sunBaseY = node.position.y; }
    const prefix = node.name.startsWith('cloudhi_') ? 'cloudhi_'
                 : node.name.startsWith('cloudlo_') ? 'cloudlo_' : null;
    if (prefix) {
      clouds.push({
        node,
        baseX: node.position.x,
        span: CLOUD_SPAN[prefix],
        speed: (prefix === 'cloudhi_' ? 0.22 : 0.36) * (0.7 + 0.6 * Math.random()),
        phase: Math.random() * Math.PI * 2,
        breathe: 0.10 + 0.09 * Math.random(),
      });
    }
    if (!node.isMesh) return;
    /* Unlit. These are flat painted silhouettes, not physical surfaces, and
       with a lit material the warm key light was tinting the palest shapes -
       the clouds came out beige under a green sky while the darker mountains
       barely moved. Basic material means the colour set below is exactly the
       colour on screen, so the palette can be reasoned about. */
    const vc = !!node.geometry.attributes.color;
    // Double sided, because these are single flat faces: the glTF material
    // arrived double sided and swapping to a default basic one culled every
    // card whose winding faced away, which made the mountains vanish.
    const vs = { vertexColors: vc, side: THREE.DoubleSide };
    const shape = SILHOUETTE[node.name];
    if (shape) {
      vs.map = makeSilhouetteTexture(buildSkyline(node.geometry, 192), shape);
    }
    if (node.name === 'ground_near') vs.map = GROUND_TEX;
    node.material = new THREE.MeshBasicMaterial(vs);
    // Authored colour kept aside: the phase tint multiplies it every frame,
    // so it must not be overwritten in place.
    // The ground carries a vertex-colour gradient that multiplies whatever
    // the material colour is, so its target has to be brightened to land on
    // the intended value rather than being darkened twice.
    node.userData.vc = vc;
    tinted.push(node);
  });
  scene.add(world);
  status.hidden = true;
  ui.hidden = false;
  // Rapier ships as wasm and has to finish loading before a world exists.
  RAPIER.init().then(startPhysics).catch((e) => {
    status.textContent = 'физика не загрузилась';
    status.hidden = false;
    console.error(e);
  });
}, undefined, (error) => {
  status.textContent = 'ошибка загрузки';
  console.error(error);
});

let climb = 0;
let climbTarget = 0;
let manualClimb = 0;
climbInput.addEventListener('input', () => {
  manualClimb = parseFloat(climbInput.value) * CLIMB_UNIT;
  climbValue.textContent = climbInput.value;
});

renderer.domElement.addEventListener('pointerdown', () => {
  if (over) restart(); else dropStone();
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

let prev = performance.now() * 0.001;

renderer.setAnimationLoop(() => {
  const now = performance.now() * 0.001;
  const dt = Math.min(0.05, now - prev);
  prev = now;

  clock = now;
  updateGame(dt, now);

  /* The tower drives the camera, and the manual slider stays as a way to
     look ahead at the sky without having to play that high. Whichever asks
     for more wins, so dragging it never fights the game. */
  const towerClimb = Math.max(0, towerTop - CAM_DEADZONE);
  climbTarget = Math.max(towerClimb, manualClimb);

  climb += (climbTarget - climb) * 0.06;
  camera.position.y = BASE_Y + climb;
  camera.lookAt(0, camera.position.y - 3.0, 0);
  if (fuji) fuji.position.y = fujiBaseY + fujiLift(climb);
  if (sun) sun.position.y = sunBaseY + sunLift(climb);

  samplePhase(climb / CLIMB_UNIT);
  paintSky();
  for (const node of tinted) {
    layerColour(node.name, node.material.color);
    if (node.userData.vc) node.material.color.multiplyScalar(1.9);
  }
  for (const mesh of stoneGroup.children) {
    stoneColour(mesh.userData.shade || 0, mesh.material.color);
    // Ghost detector: a stone sitting at the origin means it was added to the
    // scene but not positioned before this frame was drawn.
    if (Math.abs(mesh.position.x) < 1e-6 && Math.abs(mesh.position.y) < 1e-6) {
      window.__ghosts = (window.__ghosts || 0) + 1;
    }
    // A stone that leaps between its first two drawn frames is the same bug
    // wearing a different position.
    const last = mesh.userData.lastX;
    if (last !== undefined && Math.abs(mesh.position.x - last) > 0.35
        && mesh.userData.settled !== true) {
      window.__jumps = (window.__jumps || 0) + 1;
    }
    mesh.userData.lastX = mesh.position.x;
  }

  for (const c of clouds) {
    c.node.position.x = wrapSpan(c.baseX + now * c.speed, c.span);
    c.node.scale.x = 1 + c.breathe * Math.sin(now * 0.21 + c.phase);
    c.node.scale.z = 1 + c.breathe * 0.45 * Math.sin(now * 0.17 + c.phase * 1.7);
  }
  renderer.render(scene, camera);
});
</script>
