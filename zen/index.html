<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zen</title>
<style>
  html, body { margin: 0; height: 100%; background: #8FA98F; overflow: hidden; }
  canvas { display: block; }
  #ui {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    font: 600 13px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; gap: 11px; align-items: center;
    background: linear-gradient(to top, rgba(0,0,0,.35), rgba(0,0,0,0));
    color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.5);
  }
  #climb { flex: 1; }
  #status { position: fixed; top: 50%; left: 0; right: 0; text-align: center;
            font: 600 15px -apple-system, sans-serif; color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,.45); }
</style>
</head>
<body>
<div id="status">загрузка…</div>
<div id="ui" hidden>
  <span>высота</span>
  <input id="climb" type="range" min="0" max="300" value="0" step="0.1">
  <span id="climbValue">0</span>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ---------------------------------------------------------------------------
   STEP ONE: sky and ground, nothing else. Every previous pass tried to solve
   the whole scene - pagoda, trees, bridge, lantern, bloom - at once, and kept
   getting rejected as a whole. Reduced to the two things a landscape needs
   first, so each can be judged on its own before anything else is added.
--------------------------------------------------------------------------- */
/* "Прохладный сумрак" - the palette already chosen for this game and living
   in game.gd's _atmo_phases(): teal morning, soft day, plum sunset, cold
   night, walked through by how high the tower has grown. Its four stops are
   carried over here unchanged and mapped onto the climb, so the Zen page and
   the shipped game speak the same colours.

   The game's own hill tint is NOT carried over. It is a multiplier tuned to
   that scene's warm hills, and on these cool blue-grey silhouettes it turned
   everything muddy brown against a teal sky. Instead each layer's colour is
   derived from the sky of the moment: aerial perspective, where a shape sits
   closer to the sky the further away it is. That keeps every phase coherent
   by construction - plum mountains under a plum sunset, near-black under a
   night sky - and keeps the depth order fixed whatever the hour. */
const PHASES = [
  { at:   0, top: '#A9C7BF', mid: '#C6D6CD', low: '#E3D2CB', sun: '#FFF6E9' },
  { at: 100, top: '#8FB4AC', mid: '#BFD3CA', low: '#DCC9C6', sun: '#FBF3E0' },
  { at: 200, top: '#5E6796', mid: '#9A7E9E', low: '#D98E72', sun: '#FF9A5A' },
  { at: 300, top: '#141B33', mid: '#23264A', low: '#3A3560', sun: '#E7E9F6' },
];

// How far each layer sits from the sky's own colour. Farther things are
// hazier and paler, nearer things darker and denser.
const HAZE = {
  mtn_fuji: 0.20,
  mtn_far: 0.38,
  mtn_near: 0.58,
  ground_near: 0.76,
};
const CLOUD_LIFTEN = 0.34;   // clouds sit lighter than the sky, not darker
const SNOW_LIGHTEN = 0.78;

const _a = new THREE.Color(), _b = new THREE.Color();
const WHITE = new THREE.Color(1, 1, 1);
const skyTop = new THREE.Color(), skyMid = new THREE.Color(), skyLow = new THREE.Color();
const sunColour = new THREE.Color(), deepColour = new THREE.Color();

function samplePhase(slider) {
  let i = 0;
  while (i < PHASES.length - 2 && slider > PHASES[i + 1].at) i++;
  const p = PHASES[i], q = PHASES[i + 1];
  const t = Math.min(1, Math.max(0, (slider - p.at) / (q.at - p.at)));
  const mix = (key, out) => out.copy(_a.setStyle(p[key])).lerp(_b.setStyle(q[key]), t);
  mix('top', skyTop); mix('mid', skyMid); mix('low', skyLow); mix('sun', sunColour);
  // The dark end every silhouette leans toward: the sky's own top, deepened,
  // so the hue always belongs to the hour.
  deepColour.copy(skyTop).multiplyScalar(0.42);
}

/* Everything is built in the sky's own hue, moving only lightness and
   saturation. Mixing two colours instead - a warm horizon against a cool
   shadow - is what turned the mountains to brown mud: blending across hues
   lands in the dead middle. Staying on one hue cannot do that, and the
   receding layers read as one palette at every hour of the climb. */
const _hsl = { h: 0, s: 0, l: 0 };

function layerColour(name, out) {
  if (name === 'sun') return out.copy(sunColour);
  skyMid.getHSL(_hsl);
  if (name === 'fuji_snow') {
    return out.setHSL(_hsl.h, _hsl.s * 0.28, Math.min(0.97, _hsl.l + 0.34));
  }
  if (name.startsWith('cloud')) {
    return out.setHSL(_hsl.h, _hsl.s * 0.62, _hsl.l + (1 - _hsl.l) * CLOUD_LIFTEN);
  }
  const haze = HAZE[name] ?? 0;
  const l = _hsl.l + (0.13 - _hsl.l) * haze;
  const s = Math.min(1, _hsl.s * (1 + haze * 0.9));
  return out.setHSL(_hsl.h, s, l);
}

const status = document.getElementById('status');
const ui = document.getElementById('ui');
const climbInput = document.getElementById('climb');
const climbValue = document.getElementById('climbValue');

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

/* One canvas and one texture, repainted in place as the phase drifts -
   making a fresh CanvasTexture every frame would leak GPU memory. */
const skyCanvas = document.createElement('canvas');
skyCanvas.width = 4; skyCanvas.height = 512;
const skyCtx = skyCanvas.getContext('2d');
const skyTexture = new THREE.CanvasTexture(skyCanvas);
skyTexture.colorSpace = THREE.SRGBColorSpace;
scene.background = skyTexture;

function paintSky() {
  const gradient = skyCtx.createLinearGradient(0, 0, 0, 512);
  gradient.addColorStop(0.0, '#' + skyTop.getHexString());
  gradient.addColorStop(0.62, '#' + skyMid.getHexString());
  gradient.addColorStop(1.0, '#' + skyLow.getHexString());
  skyCtx.fillStyle = gradient;
  skyCtx.fillRect(0, 0, 4, 512);
  skyTexture.needsUpdate = true;
}

// Far plane well past the Fuji: it now sits at ~470 units, and the old 300
// would have clipped it out of the scene entirely.
const camera = new THREE.PerspectiveCamera(24, innerWidth / innerHeight, 1, 1200);
const CAMERA_Z = 40;
const BASE_Y = 4.0;
camera.position.set(0, BASE_Y, CAMERA_Z);
camera.lookAt(0, BASE_Y - 3.0, 0);

// One key light and one soft fill - nothing else competing for attention
// while sky and ground are being judged on their own.
// No lights: every material is unlit, so nothing here would read them.

let world = null;
let fuji = null;
let fujiBaseY = 0;

/* The Fuji is lifted by the climb, and that is deliberate rather than
   physical. A static mountain cannot do what the owner drew: as the camera
   rises, EVERYTHING in the distance sinks down the frame, the far things
   just more slowly than the near ones. So parallax alone reveals more of
   the Fuji while its summit still travels downward - measured, it drops
   about a fifth of the frame between climb 100 and climb 200, where the
   drawing asks for the summit to leave the frame through the top instead.

   Climb 100 is left exactly where the geometry puts it, which is already
   the drawn frame. Past that the mountain is raised so the summit clears
   the top edge by climb 200, and the ridges keep sinking on their own. */
const CLIMB_UNIT = 0.16;             // slider value -> camera height units
const FUJI_LIFT = 20.0;              // scene units at full reveal
const FUJI_FROM = 100 * CLIMB_UNIT;  // starts emerging at slider 100
const FUJI_TO = 200 * CLIMB_UNIT;    // fully out by slider 200
/* Even, across the whole range. The previous curve decelerated - it was set
   to keep slider 150 at the lift signed off there, which packed most of its
   travel into the first half and rose exactly as fast as before. Those two
   wishes are the same thing said in opposite directions, and slower wins, so
   this is a plain smoothstep: eases out of the ridges, steady through the
   middle, settles at 200. */
function fujiLift(cameraClimb) {
  const t = Math.min(1, Math.max(0, (cameraClimb - FUJI_FROM) / (FUJI_TO - FUJI_FROM)));
  return FUJI_LIFT * t * t * (3 - 2 * t);
}

/* The sun comes up on the right, starting after the Fuji is already on its
   way so the two do not arrive together. It sits farther out than the
   mountain, so the sinking ridges uncover it and the disc itself only
   drifts - the same reason the Fuji stopped looking like it was flying. */
const SUN_LIFT = 122.0;
const SUN_FROM = 140 * CLIMB_UNIT;
const SUN_TO = 300 * CLIMB_UNIT;
let sun = null;
let sunBaseY = 0;

function sunLift(cameraClimb) {
  const t = Math.min(1, Math.max(0, (cameraClimb - SUN_FROM) / (SUN_TO - SUN_FROM)));
  return SUN_LIFT * t * t * (3 - 2 * t);
}

/* The clouds are separate little shapes filling a zone, not two long
   ribbons: the owner's two strokes marked WHERE clouds should be, not the
   clouds themselves. Each drifts sideways and slowly breathes its width, so
   the zone travels and changes shape. Farther clouds drift slower, which
   keeps the depth reading. */
const clouds = [];
const tinted = [];
const CLOUD_SPAN = { cloudhi_: 45.0, cloudlo_: 36.0 };

function wrapSpan(v, span) {
  const half = span * 0.5;
  return ((v + half) % span + span) % span - half;
}

new GLTFLoader().load('assets/zen_scene.glb?v=2699ec2df3d656365f20fa1e211224bb', (gltf) => {
  world = gltf.scene;
  world.traverse((node) => {
    if (node.name === 'mtn_fuji') { fuji = node; fujiBaseY = node.position.y; }
    if (node.name === 'sun') { sun = node; sunBaseY = node.position.y; }
    const prefix = node.name.startsWith('cloudhi_') ? 'cloudhi_'
                 : node.name.startsWith('cloudlo_') ? 'cloudlo_' : null;
    if (prefix) {
      clouds.push({
        node,
        baseX: node.position.x,
        span: CLOUD_SPAN[prefix],
        speed: (prefix === 'cloudhi_' ? 0.22 : 0.36) * (0.7 + 0.6 * Math.random()),
        phase: Math.random() * Math.PI * 2,
        breathe: 0.10 + 0.09 * Math.random(),
      });
    }
    if (!node.isMesh) return;
    /* Unlit. These are flat painted silhouettes, not physical surfaces, and
       with a lit material the warm key light was tinting the palest shapes -
       the clouds came out beige under a green sky while the darker mountains
       barely moved. Basic material means the colour set below is exactly the
       colour on screen, so the palette can be reasoned about. */
    const vc = !!node.geometry.attributes.color;
    // Double sided, because these are single flat faces: the glTF material
    // arrived double sided and swapping to a default basic one culled every
    // card whose winding faced away, which made the mountains vanish.
    const vs = { vertexColors: vc, side: THREE.DoubleSide };
    node.material = new THREE.MeshBasicMaterial(vs);
    // Authored colour kept aside: the phase tint multiplies it every frame,
    // so it must not be overwritten in place.
    // The ground carries a vertex-colour gradient that multiplies whatever
    // the material colour is, so its target has to be brightened to land on
    // the intended value rather than being darkened twice.
    node.userData.vc = vc;
    tinted.push(node);
  });
  scene.add(world);
  status.hidden = true;
  ui.hidden = false;
}, undefined, (error) => {
  status.textContent = 'ошибка загрузки';
  console.error(error);
});

let climb = 0;
let climbTarget = 0;
climbInput.addEventListener('input', () => {
  climbTarget = parseFloat(climbInput.value) * 0.16;
  climbValue.textContent = climbInput.value;
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  climb += (climbTarget - climb) * 0.06;
  camera.position.y = BASE_Y + climb;
  camera.lookAt(0, camera.position.y - 3.0, 0);
  if (fuji) fuji.position.y = fujiBaseY + fujiLift(climb);
  if (sun) sun.position.y = sunBaseY + sunLift(climb);

  samplePhase(climb / CLIMB_UNIT);
  paintSky();
  for (const node of tinted) {
    layerColour(node.name, node.material.color);
    if (node.userData.vc) node.material.color.multiplyScalar(1.9);
  }

  const now = performance.now() * 0.001;
  for (const c of clouds) {
    c.node.position.x = wrapSpan(c.baseX + now * c.speed, c.span);
    c.node.scale.x = 1 + c.breathe * Math.sin(now * 0.21 + c.phase);
    c.node.scale.z = 1 + c.breathe * 0.45 * Math.sin(now * 0.17 + c.phase * 1.7);
  }
  renderer.render(scene, camera);
});
</script>
</body>
</html>
