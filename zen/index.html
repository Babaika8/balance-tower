<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zen</title>
<style>
  html, body { margin: 0; height: 100%; background: #8FA98F; overflow: hidden; }
  canvas { display: block; }
  #ui {
    position: fixed; left: 0; right: 0; bottom: 0;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    font: 600 13px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex; gap: 11px; align-items: center;
    background: linear-gradient(to top, rgba(0,0,0,.35), rgba(0,0,0,0));
    color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.5);
  }
  #climb { flex: 1; }
  #status { position: fixed; top: 50%; left: 0; right: 0; text-align: center;
            font: 600 15px -apple-system, sans-serif; color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,.45); }
</style>
</head>
<body>
<div id="status">загрузка…</div>
<div id="ui" hidden>
  <span>высота</span>
  <input id="climb" type="range" min="0" max="200" value="0" step="0.1">
  <span id="climbValue">0</span>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

/* ---------------------------------------------------------------------------
   STEP ONE: sky and ground, nothing else. Every previous pass tried to solve
   the whole scene - pagoda, trees, bridge, lantern, bloom - at once, and kept
   getting rejected as a whole. Reduced to the two things a landscape needs
   first, so each can be judged on its own before anything else is added.
--------------------------------------------------------------------------- */
const SKY_TOP = '#4E7A68';
const SKY_MID = '#8CB79A';
const SKY_LOW = '#EFE3C0';

const status = document.getElementById('status');
const ui = document.getElementById('ui');
const climbInput = document.getElementById('climb');
const climbValue = document.getElementById('climbValue');

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

function makeSkyTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 4; canvas.height = 512;
  const ctx = canvas.getContext('2d');
  const gradient = ctx.createLinearGradient(0, 0, 0, 512);
  gradient.addColorStop(0.0, SKY_TOP);
  gradient.addColorStop(0.62, SKY_MID);
  gradient.addColorStop(1.0, SKY_LOW);
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 4, 512);
  const texture = new THREE.CanvasTexture(canvas);
  texture.colorSpace = THREE.SRGBColorSpace;
  return texture;
}
scene.background = makeSkyTexture();

const camera = new THREE.PerspectiveCamera(24, innerWidth / innerHeight, 1, 300);
const CAMERA_Z = 40;
const BASE_Y = 4.0;
camera.position.set(0, BASE_Y, CAMERA_Z);
camera.lookAt(0, BASE_Y - 3.0, 0);

// One key light and one soft fill - nothing else competing for attention
// while sky and ground are being judged on their own.
const key = new THREE.DirectionalLight(0xFFEAC8, 2.2);
key.position.set(-6, 15, 18);
scene.add(key);
const hemi = new THREE.HemisphereLight(0xBFE0C8, 0x4A5A46, 0.6);
scene.add(hemi);

let world = null;
let fuji = null;
let fujiBaseY = 0;

/* The Fuji is lifted by the climb, and that is deliberate rather than
   physical. A static mountain cannot do what the owner drew: as the camera
   rises, EVERYTHING in the distance sinks down the frame, the far things
   just more slowly than the near ones. So parallax alone reveals more of
   the Fuji while its summit still travels downward - measured, it drops
   about a fifth of the frame between climb 100 and climb 200, where the
   drawing asks for the summit to leave the frame through the top instead.

   Climb 100 is left exactly where the geometry puts it, which is already
   the drawn frame. Past that the mountain is raised so the summit clears
   the top edge by climb 200, and the ridges keep sinking on their own. */
const CLIMB_UNIT = 0.16;             // slider value -> camera height units
const FUJI_LIFT = 40.0;              // scene units at full reveal
const FUJI_FROM = 100 * CLIMB_UNIT;  // starts emerging at slider 100
const FUJI_TO = 150 * CLIMB_UNIT;    // fully out by slider 150

function fujiLift(cameraClimb) {
  const t = Math.min(1, Math.max(0, (cameraClimb - FUJI_FROM) / (FUJI_TO - FUJI_FROM)));
  return FUJI_LIFT * t * t * (3 - 2 * t);   // smoothstep, so it eases in
}

new GLTFLoader().load('assets/zen_scene.glb?v=55f73aecce539c0b1ff1bf5c6a5f3caf', (gltf) => {
  world = gltf.scene;
  world.traverse((node) => {
    if (node.name === 'mtn_fuji') { fuji = node; fujiBaseY = node.position.y; }
    if (!node.isMesh) return;
    if (node.geometry.attributes.color) node.material.vertexColors = true;
    node.material.roughness = 0.9;
    node.material.needsUpdate = true;
  });
  scene.add(world);
  status.hidden = true;
  ui.hidden = false;
}, undefined, (error) => {
  status.textContent = 'ошибка загрузки';
  console.error(error);
});

let climb = 0;
let climbTarget = 0;
climbInput.addEventListener('input', () => {
  climbTarget = parseFloat(climbInput.value) * 0.16;
  climbValue.textContent = climbInput.value;
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  climb += (climbTarget - climb) * 0.06;
  camera.position.y = BASE_Y + climb;
  camera.lookAt(0, camera.position.y - 3.0, 0);
  if (fuji) fuji.position.y = fujiBaseY + fujiLift(climb);
  renderer.render(scene, camera);
});
</script>
</body>
</html>
